<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" role="img" aria-label="Animated heartbeat line" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .grid { stroke: #2dd4bf; stroke-opacity: .08; stroke-width: 1; }
      .line { fill: none; stroke: #2dd4bf; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
              stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 3.2s linear infinite; }
      .title { font: 700 40px 'Courier New', monospace; fill: #fff; }
      .sub { font: 400 16px 'Courier New', monospace; fill: #2dd4bf; }
      @keyframes draw { 0% { stroke-dashoffset: 1400; } 70% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -1400; } }
    </style>
  </defs>
  <rect width="900" height="200" rx="14" fill="url(#bg)"/>
  <g class="grid">
    <path d="M0 40H900M0 80H900M0 120H900M0 160H900"/>
    <path d="M100 0V200M200 0V200M300 0V200M400 0V200M500 0V200M600 0V200M700 0V200M800 0V200"/>
  </g>
  <path class="line" filter="url(#glow)"
    d="M0 110 H120 L140 110 L155 80 L170 110 H230 L250 120 L270 30 L295 170 L315 110 H380 L400 95 L430 125 L450 110 H640 L660 110 L675 80 L690 110 H750 L770 120 L790 30 L815 170 L835 110 H900"/>
  <text x="450" y="62" text-anchor="middle" class="title">prakhar@bantu:~$</text>
  <text x="450" y="188" text-anchor="middle" class="sub">machines that read X-rays · policies that listen to youth</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
